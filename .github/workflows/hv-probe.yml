name: hv-probe

# Checks the first start of a claude sandbox on a hosted runner.
on:
  push:
    branches: [hv-probe]

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Open /dev/kvm to the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the engine from the fork release
        run: |
          curl -fsSL -o smolvm.tar.gz https://github.com/triandco/smolvm/releases/download/patched-1.35.1-2/smolvm-1.35.1-patched.2-linux-x86_64.tar.gz
          mkdir engine && tar -xzf smolvm.tar.gz -C engine --strip-components=1
          ls -la engine
          echo "$PWD/engine" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build bento at the rev the app pins
        run: |
          cargo install --locked --git https://github.com/triandco/smolbento.git --rev f8d0bf2b824fe41b6e8591c1bfde163b575f063c --bin smolbento smolbento
          ln -s "$HOME/.cargo/bin/smolbento" "$HOME/.cargo/bin/bento"

      - name: Start a claude sandbox as the TWM does
        env:
          SMOLBENTO_SOCKET_DIR: ${{ runner.temp }}/sbt
        run: |
          export SMOLBENTO_SMOLVM="$(command -v smolvm)"
          stamp() { while IFS= read -r line; do printf '%4ss %s\n' "$SECONDS" "$line"; done; }
          mkdir -p ws
          echo "== without a network policy"
          SECONDS=0
          timeout 180 bento run --detach --name first claude "$PWD/ws" < /dev/null 2>&1 | stamp; echo "exit ${PIPESTATUS[0]}"
          echo "== with the balanced policy"
          bento policy init balanced 2>&1 | tail -1
          SECONDS=0
          timeout 600 bento run --detach --name second claude "$PWD/ws" < /dev/null 2>&1 | stamp; echo "exit ${PIPESTATUS[0]}"
          bento ls 2>&1
